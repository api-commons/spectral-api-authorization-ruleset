openapi: 3.1.0
info:
  title: Noncompliant Widgets API
  version: 1.0.0
  description: >-
    Violates the OpenAPI half of the profile: plaintext servers, no global
    security, implicit + password flows, plaintext OAuth URLs, and empty scopes.
servers:
  - url: http://api.example.com/v1
paths:
  /widgets:
    get:
      operationId: listWidgets
      description: List widgets.
      responses:
        "200":
          description: A list of widgets.
components:
  securitySchemes:
    oauth2Auth:
      type: oauth2
      description: Offers disallowed flows over plaintext with no scopes.
      flows:
        implicit:
          authorizationUrl: http://as.example.com/authorize
          scopes: {}
        password:
          tokenUrl: http://as.example.com/token
          scopes: {}
